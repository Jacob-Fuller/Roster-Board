# Builds the native Roster Board app (mobile/) for Android on GitHub's servers.
# Runs when a commit message contains [android], or by hand from Actions.
# Produces an installable test APK (64-bit ARM phones, which is nearly all
# current Android phones) and publishes it to the android-builds branch.
name: Native app for Android

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # the APK is pushed to the android-builds branch

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
      - name: Create the Android project
        run: npx expo prebuild --platform android --clean
      - name: Build the APK
        working-directory: mobile/android
        run: |
          mkdir -p ../build
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../build/gradle.txt | tail -60
          exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publish to the android-builds branch
        if: always()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/RosterBoard-test.apk 2>/dev/null || true
          tail -300 build/gradle.txt > out/gradle-log.txt 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > out/RESULT.txt
          cd out
          git init -q -b android-builds
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Android build for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds
