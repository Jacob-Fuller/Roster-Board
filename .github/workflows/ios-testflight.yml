# Builds the Roster Board iPhone app on GitHub's Macs and uploads it to TestFlight.
# Run it from GitHub: Actions -> "iOS build to TestFlight" -> Run workflow.
#   setup : registers the app ID and creates the signing certificate (run once, first)
#   beta  : builds the app and uploads it to TestFlight
name: iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      lane:
        description: What to run
        type: choice
        options: [beta, setup]
        default: beta

permissions:
  contents: write   # signing certificates are stored, encrypted, on the fastlane-match branch

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install tools
        run: |
          npm install
          gem install fastlane -N

      - name: Create the iOS project (web app, icon, launch screen)
        run: npm run ios:add

      - name: App settings
        run: |
          PLIST=ios/App/App/Info.plist
          # No custom encryption, so App Store Connect skips the export-compliance question
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Roster Board" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Roster Board" "$PLIST"
          # Shift alarms (AlarmKit): the text shown when iOS asks permission
          /usr/libexec/PlistBuddy -c "Delete :NSAlarmKitUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAlarmKitUsageDescription string Roster Board sets an alarm before your shifts so you never miss one." "$PLIST"

      - name: Build and upload
        run: fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
