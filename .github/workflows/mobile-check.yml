# Checks the native app (mobile/) on every push to it: installs packages, runs the
# sync tests against the web app's own merge code, type-checks, builds the web
# preview and takes screenshots. Nothing is deployed.
name: Native app check

permissions:
  contents: write   # results are pushed to the native-app-ci branch for review

on:
  push:
    branches-ignore: [native-app-ci]
    paths: ["mobile/**", ".github/workflows/mobile-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          mkdir -p screens
          npm install --no-audit --no-fund 2>&1 | tail -30 > screens/install.txt
      - name: Match package versions to the Expo SDK
        run: |
          (npx expo install --check 2>&1 || true) > screens/versions.txt
          npx expo install --fix >> screens/versions.txt 2>&1
          git diff -- package.json >> screens/versions.txt || true
          cp package.json screens/package.json
      - name: Record library interfaces
        run: |
          mkdir -p screens/lib-types
          cp -r node_modules/expo-iap/build/*.d.ts screens/lib-types/ 2>/dev/null || true
          cp node_modules/expo-iap/package.json screens/lib-types/expo-iap-package.json 2>/dev/null || true
          (cat node_modules/expo-iap/README.md 2>/dev/null | head -400) > screens/lib-types/README.md || true
          ls node_modules/@expo-google-fonts/fraunces/ > screens/lib-types/fraunces-files.txt 2>/dev/null || true
      - name: Sync rules match the web app
        run: npm test 2>&1 | tee screens/test.txt
      - name: Type-check
        run: npx tsc --noEmit 2>&1 | tee screens/tsc.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Expo config check
        if: always()
        run: (npx expo-doctor 2>&1 || true) | tee screens/doctor.txt
      - name: Build web preview
        run: npx expo export --platform web --output-dir dist 2>&1 | tee screens/export.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          (cd dist && python3 -m http.server 8090 >/dev/null 2>&1 &)
          sleep 1
          node scripts/screens.mjs
          node scripts/appstore.mjs 2>&1 | tee screens/appstore-log.txt || true
          node scripts/store-captures.mjs 2>&1 | tee screens/store-log.txt || true
      - name: Publish results to the native-app-ci branch
        if: always()
        run: |
          cd screens
          git init -q -b native-app-ci
          git config user.name "github-actions"; git config user.email "actions@github.com"
          echo "${{ github.sha }} ${{ job.status }}" > RESULT.txt
          git add -A && git commit -qm "Check results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-app-ci
