# Checks the native app (mobile/) on every push to it: installs packages, runs the
# sync tests against the web app's own merge code, type-checks, builds the web
# preview and takes screenshots. Nothing is deployed.
name: Native app check

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Match package versions to the Expo SDK
        run: |
          npx expo install --check || true
          npx expo install --fix
          git diff --stat -- package.json || true
          git diff -- package.json || true
      - name: Sync rules match the web app
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Expo config check
        run: npx expo-doctor || true
      - name: Build web preview
        run: npx expo export --platform web --output-dir dist
      - name: Screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          (cd dist && python3 -m http.server 8090 >/dev/null 2>&1 &)
          sleep 1
          node scripts/screens.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            mobile/screens/
            mobile/package.json
