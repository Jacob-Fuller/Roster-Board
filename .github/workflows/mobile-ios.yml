# Builds the native Roster Board app (mobile/) on GitHub's Macs and uploads it
# to TestFlight. Runs when a commit message contains [testflight], or by hand
# from Actions -> "Native app to TestFlight" -> Run workflow.
name: Native app to TestFlight

on:
  push:
    paths: ["mobile/**"]
  workflow_dispatch:

permissions:
  contents: write   # the build summary is pushed to the ios-build-info branch

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install tools
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
          gem install fastlane -N
      - name: Type-check (stops a broken build reaching testers)
        run: npx tsc --noEmit
      - name: Create the iOS project
        run: |
          npx expo prebuild --platform ios --clean
          # Reminders are local notifications only; no push entitlement is needed
          for f in ios/*/*.entitlements; do /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" 2>/dev/null || true; done
      - name: Build and upload
        run: |
          set -o pipefail
          fastlane beta 2>&1 | tee ../fastlane.log
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
      - name: Record what's in the build
        if: always()
        run: |
          mkdir -p ../build-info
          (grep -v -iE "p8|password|token|secret" ../fastlane.log 2>/dev/null | tail -80 || true) > ../build-info/fastlane-tail.txt
          (grep -o "RosterBoardWidget[^ ;\"]*" ios/*.xcodeproj/project.pbxproj | sort -u || true) > ../build-info/targets.txt
          (for f in build/*.ipa; do unzip -l "$f" | grep -E "\.appex/|Info.plist$" | head -40; done || true) > ../build-info/ipa.txt
          (ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null; for p in ~/Library/MobileDevice/Provisioning\ Profiles/*; do security cms -D -i "$p" 2>/dev/null | plutil -extract Name raw - 2>/dev/null; done) > ../build-info/profiles.txt || true
          cd ../build-info
          echo "${{ github.sha }} ${{ job.status }}" > RESULT.txt
          git init -q -b ios-build-info
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Build info for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-build-info
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: ~/Library/Logs/gym/
